<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Все чаты</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body class="dock" data-mode="dock">
  <header class="top">
    <h1>Все чаты</h1>
    <a class="text-link" href="/look">Вид</a>
    <a class="text-link" href="/settings">Войти</a>
  </header>
  <div class="lamps" id="lamps"></div>
  <div class="tools">
    <button class="ghost" id="check" type="button">Проверить</button>
    <button class="ghost" id="clear-check" type="button">Убрать проверку</button>
  </div>
  <div class="log" id="log">
    <p class="empty" id="empty">Пока тихо. Ник для себя меняется кликом по имени, на стриме он останется настоящим.</p>
  </div>
  <form class="composer" id="composer">
    <input id="text" maxlength="500" placeholder="Написать во все чаты" autocomplete="off">
    <button type="submit">Во все</button>
  </form>
  <script type="module" src="/app.js"></script>
</body>
</html>
