<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Все чаты</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body class="dock" data-mode="dock">
  <header class="top">
    <h1>Все чаты</h1>
    <a class="text-link" href="/settings">Подключения</a>
  </header>
  <div class="lamps" id="lamps"></div>
  <button class="ghost" id="check" type="button">Проверить</button>
  <div class="log" id="log">
    <p class="empty" id="empty">Пока тихо. «Проверить» покажет сообщения. Ник зрителя меняется кликом по имени.</p>
  </div>
  <form class="nick" id="nick" hidden>
    <label class="nick-label" id="nick-label" for="nick-input">Ник</label>
    <input id="nick-input" maxlength="40" autocomplete="off">
    <button type="submit">Сохранить ник</button>
    <button class="ghost" id="nick-reset" type="button">Как было</button>
  </form>
  <form class="composer" id="composer">
    <input id="text" maxlength="500" placeholder="Написать во все чаты" autocomplete="off">
    <button type="submit">Во все</button>
  </form>
  <script type="module" src="/app.js"></script>
</body>
</html>
